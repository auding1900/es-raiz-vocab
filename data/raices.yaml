# ============================================================================
# 词根库 —— raices.yaml
# ============================================================================
# 每条记录 = 一个“词根节点”。只有三个字段（脚本按白名单校验，多写/少写都报错）：
#
#   id            唯一短代号，同时用作 mermaid 节点 id
#   root_name     词根书写形式（不含连字符）
#   latin_origin  拉丁本源：拉丁词形 + 本源含义（英文短注）
#                 ⚠ 这是“词根本义”，不是任何现代单词的释义
#
# 注意：本文件不列单词。单词节点统一在 relations.yaml 的 target 处声明，
#       CEFR 级别挂在派生边上，避免同一份数据两处维护。
#
# 禁止出现：现代词义 / 例句 / 翻译 / 中文解释（中文只允许出现在注释里）。
# 词义、语体、搭配、例句一律跳转豆包查询（见 README）。
# ============================================================================

version: 2

