# ============================================================================
# 前缀 / 后缀库 —— afijos.yaml
# ============================================================================
# 每条记录 = 一个“词缀节点”。四个字段：
#
#   id      唯一标识（建议用带连字符的写法标明位置）
#   affix   词缀书写形式：前缀以 - 结尾，后缀以 - 开头
#   meaning 词缀自身的构词功能（英文短注）
#           ⚠ 这是词缀的功能说明，不是任何单词的释义
#   type    prefix | suffix
#
# 禁止出现：单词释义 / 例句 / 翻译 / 中文解释。
# ============================================================================

version: 2

afijos:
  # ---- 样例：与 duc 词族相关的前缀 ----
  - id: "re-"
    affix: "re-"
    meaning: "again; back"
    type: prefix

  - id: "de-"
    affix: "de-"
    meaning: "down; away from"
    type: prefix

  # ---- 样例：后缀 ----
  - id: "-ción"
    affix: "-ción"
    meaning: "action; result"
    type: suffix

  # ---- 新增词缀请复制上面的结构 ----
  # - id: "in-"
  #   affix: "in-"
  #   meaning: "into; towards"
  #   type: prefix
